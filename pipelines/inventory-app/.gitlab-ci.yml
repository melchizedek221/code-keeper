# .gitlab-ci.yml
# CI/CD pipeline for building, testing, scanning, containerizing, and deploying the API Gateway app

stages:
  - build
  - test
  - scan
  - containerizing
  - deploy-staging
  - deploy-production

variables:
  DOCKER_TLS_CERTDIR: ""
  IMAGE_NAME: "$CI_REGISTRY_IMAGE/inventory-app:$CI_COMMIT_SHORT_SHA"

# Use python image for build, test, scan
.default_python_template: &python_template
  image: python:3.11
  before_script:
    - apt-get update && apt-get install -y npm
    - python -m venv venv
    - . venv/bin/activate
    - pip install --upgrade pip

before_script:
  - apt-get update && apt-get install -y openssh-client
  - mkdir -p ~/.ssh
  - echo "$GITLAB_SSH_KEY_B64" | base64 -d > ~/.ssh/gitlab_key
  - chmod 600 ~/.ssh/gitlab_key
  - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config

build:
  stage: build
  <<: *python_template
  script:
    - echo "[INFO] Build stage (Python does not need compilation)"

test:
  stage: test
  <<: *python_template
  script:
    - python -m unittest discover || echo "No tests yet"

scan:
  stage: scan
  <<: *python_template
  script:
    - npm install -g snyk
    - snyk auth $SNYK_TOKEN
    - snyk test --file=requirements.txt --skip-unresolved || true


docker:
  stage: containerizing
  image: docker:20.10.24
  services:
    - name: docker:20.10.24-dind
      alias: docker
  variables:
    # DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DNS: "8.8.8.8"  
  script:
    - unset DOCKER_HOST
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - docker build -t $IMAGE_NAME .
    - docker push $IMAGE_NAME
  only:
    - main

# Deploy to staging: runs on microservices-vm using the Vagrant SSH private key and passes secrets as env vars
deploy-staging:
  stage: deploy-staging
  image: ubuntu:latest
  script:
    - echo "[INFO] Deploying to staging environment..."
    - mkdir -p ~/.ssh
    - echo "$GITLAB_SSH_KEY_B64" | base64 -d > ~/.ssh/gitlab_key
    - chmod 600 ~/.ssh/gitlab_key
    - ssh -i ~/.ssh/gitlab_key -o StrictHostKeyChecking=no ubuntu@52.23.253.203 "
        sudo docker pull $IMAGE_NAME 
        && sudo docker stop inventory-app-staging || true 
        && sudo docker rm inventory-app-staging || true 
        && sudo docker run -d --name inventory-app-staging -p 5203:3002 -e SECRET_KEY='$SECRET_KEY' -e DATABASE_URL='$DATABASE_URL' $IMAGE_NAME"
  only:
    - main


# Deploy to production: runs on microservices-vm using the Vagrant SSH private key, manual approval required, passes secrets as env vars
deploy-production:
  stage: deploy-production
  image: ubuntu:latest
  script:
    - echo "[INFO] Deploying to production environment..."
    # Use the Vagrant SSH key to authenticate and pass secrets to the container
    - mkdir -p ~/.ssh
    - echo "$GITLAB_SSH_KEY_B64" | base64 -d > ~/.ssh/gitlab_key
    - chmod 600 ~/.ssh/gitlab_key
    - ssh -i ~/.ssh/gitlab_key -o StrictHostKeyChecking=no ubuntu@3.92.206.44 "
        sudo docker pull $IMAGE_NAME 
        && sudo docker stop inventory-app-prod || true 
        && sudo docker rm inventory-app-prod || true 
        && sudo docker run -d --name inventory-app-prod -p 5203:3002 -e SECRET_KEY='$SECRET_KEY' -e DATABASE_URL='$DATABASE_URL' $IMAGE_NAME"  
  only:
    - main
  when: manual

