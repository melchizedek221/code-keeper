apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: microservices-network
type: Opaque
data:
  # Store credentials in base64-encoded format
  inventory-username: b3NhbWI=  # base64 for "inventory_user"
  inventory-password: b3NhbWI=     # base64 for "password123"
  billing-username: b3NhbWI=       # base64 for "billing_user"
  billing-password: b3NhbWI=        # base64 for "password123"
