apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: microservices-network
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      restartPolicy: Always
      containers:
      - name: api-gateway
        image: osamb/api_gateway:latest
        env:
        - name: INVENTORY_API_URL
          value: "http://inventory-app:8080"
        - name : RABBITMQ_HOST
          value: rabbitmq
        - name: RABBITMQ_QUEUE
          valueFrom:
              secretKeyRef:
                name: rabbitmq-secrets
                key: rabbitmq-queue
        - name: RABBITMQ_USER
          valueFrom:
              secretKeyRef:
                name: orchestrator-secrets
                key: RABBITMQ_USER
        - name: RABBITMQ_PASSWORD
          valueFrom:
              secretKeyRef:
                name: orchestrator-secrets
                key: RABBITMQ_PASSWORD
        ports:
        - containerPort: 3000
---
apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: microservices-network
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 60
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: microservices-network
spec:
  type: LoadBalancer
  ports:
    - port: 3000
  selector:
    app: api-gateway
