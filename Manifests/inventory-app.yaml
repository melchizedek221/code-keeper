apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-app
  namespace: microservices-network
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-app
  template:
    metadata:
      labels:
        app: inventory-app
    spec:
      restartPolicy: Always
      # initContainers:
      # - name: wait-for-inventory-db
      #   image: busybox:1.28
      #   command: ['sh', '-c', 'echo "Waiting for inventory-db to be ready"; until nc -z -v -w30 inventory-db 5432; do echo "Waiting for inventory-db"; sleep 5; done;']
      containers:
      - name: inventory-app
        image: osamb/inventory_app:latest
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        env:
        - name: INVENTORY_DB_URI
          valueFrom:
              secretKeyRef:
                name: orchestrator-secrets
                key: INVENTORY_DB_URI
        - name: DB_HOST
          value: "inventory-db"
        ports:
        - containerPort: 8080
---
apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: inventory-app-hpa
  namespace: microservices-network
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inventory-app
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 60
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-app
  namespace: microservices-network
spec:
  # clusterIP: 10.43.0.6
  ports:
    - port: 8080
  selector:
    app: inventory-app
