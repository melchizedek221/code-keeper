---
- name: Déploiement de GitLab CE
  hosts: gitlab
  become: yes

  vars:
    gitlab_external_url: "http://{{ ansible_host }}"

  tasks:
    - name: Installer les dépendances
      apt:
        name:
          - curl
          - openssh-server
          - ca-certificates
          - tzdata
        update_cache: yes
        state: present

    - name: Ajouter le dépôt GitLab
      shell: |
        curl https://packages.gitlab.com/install/repositories/gitlab/gitlab-ce/script.deb.sh | sudo bash

    - name: Installer GitLab CE
      apt:
        name: gitlab-ce
        state: present

    - name: Configurer l'URL externe dans gitlab.rb
      lineinfile:
        path: /etc/gitlab/gitlab.rb
        regexp: '^external_url'
        line: "external_url '{{ gitlab_external_url }}'"
        create: yes

    - name: Reconfigurer GitLab
      command: gitlab-ctl reconfigure
